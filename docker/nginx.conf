# Reverse proxy for stocks.example.com
#
# Copy to /etc/nginx/sites-available/stocks.example.com, symlink into
# sites-enabled, then run:
#
#   sudo certbot --nginx -d stocks.example.com
#
# The only non-obvious requirement is the WebSocket upgrade block: without
# `Upgrade`/`Connection` and a long read timeout, nginx will close the game
# socket roughly once a minute and every player will see it reconnect.

upstream stockgame {
    server 127.0.0.1:8765;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name stocks.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stocks.example.com;

    ssl_certificate     /etc/letsencrypt/live/stocks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocks.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The game is a terminal client, not a browser app; nothing needs to be
    # large. This mostly limits the damage a malformed request can do.
    client_max_body_size 64k;

    access_log /var/log/nginx/stockgame.access.log;
    error_log  /var/log/nginx/stockgame.error.log warn;

    # --- WebSocket: the game connection -----------------------------------
    location /ws {
        proxy_pass http://stockgame;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Game sockets are long-lived and mostly quiet between ticks.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # --- REST: registration, login, read-only data ------------------------
    location /api/ {
        proxy_pass http://stockgame;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = / {
        return 200 "Stock Market Game server. Play with: stockgame --server $host\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
