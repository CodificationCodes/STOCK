# Optional PostgreSQL overlay, for when SQLite stops being enough.
#
#   docker compose -f docker-compose.yml -f docker/postgres-compose.yml up -d
#
# The application needs no code change: it is the same SQLAlchemy models and
# the same Alembic migrations against a different driver.

services:
  db:
    image: postgres:16-alpine
    container_name: stockgame-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockgame
      POSTGRES_DB: stockgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - stockgame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockgame"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    depends_on:
      db:
        condition: service_healthy
    environment:
      STOCKGAME_DATABASE_URL: >-
        postgresql+asyncpg://stockgame:${POSTGRES_PASSWORD}@db:5432/stockgame

volumes:
  stockgame-pgdata:
