[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockgame"
version = "0.1.0"
description = "A competitive, persistent, multiplayer stock market simulator that lives in your terminal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Spike Forsythe" }]
keywords = ["tui", "terminal", "game", "stock-market", "multiplayer", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]

# Client-only dependencies. Installing the package with no extras gives a
# fully working game client -- the server stack is deliberately optional so
# players never have to build/install database or web-framework wheels.
dependencies = [
    "textual>=0.79",
    "rich>=13.7",
    "httpx>=0.27",
    "websockets>=12.0",
    "platformdirs>=4.2",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
stockgame = "stockgame.client.cli:main"
stockgame-server = "stockgame.server.cli:main"
stockgame-admin = "stockgame.server.admin:main"

[project.urls]
Homepage = "https://github.com/SpikeForsythe/stock-market-game"
Issues = "https://github.com/SpikeForsythe/stock-market-game/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stockgame"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependency injection relies on calls in defaults
    "RUF012", # Textual class attrs (BINDINGS/CSS) are intentionally mutable
]

[tool.ruff.lint.isort]
known-first-party = ["stockgame", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/stockgame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/stockgame"]
